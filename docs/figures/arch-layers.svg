<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <defs>
    <style>
      .t { font-family: Helvetica, Arial, sans-serif; fill:#1a1710; font-size:12px; }
      .t-w { fill:#fbfaf7; }
      .t-title { font-size:15px; font-weight:700; }
      .t-s { font-size:10px; fill:#4a453c; }
      .l1 { fill:#1a1710; }
      .l2 { fill:#2e2a22; }
      .l3 { fill:#e8f0ea; stroke:#1a1710; stroke-width:1.2; }
      .l4 { fill:#eef2f8; stroke:#1a1710; stroke-width:1.2; }
      .l5 { fill:#f7f4ef; stroke:#1a1710; stroke-width:1.2; }
    </style>
  </defs>
  <rect width="920" height="400" fill="#fbfaf7"/>
  <text x="24" y="28" class="t t-title">Figure 2 - Protocol stack: product layer vs rails</text>

  <rect x="60" y="56" width="800" height="52" rx="4" class="l5"/>
  <text x="80" y="78" class="t" style="font-weight:700">L5 - Operator surface</text>
  <text x="80" y="96" class="t t-s">Desk tabs, foresight ticket, health 0-10, oracle strip, command palette, verify pages</text>

  <rect x="60" y="118" width="800" height="52" rx="4" class="l4"/>
  <text x="80" y="140" class="t" style="font-weight:700">L4 - Read aggregation (BorrowDeskLens)</text>
  <text x="80" y="158" class="t t-s">Desk / account / market snapshots - batched RPCs for keepers and UI</text>

  <rect x="60" y="180" width="800" height="70" rx="4" class="l1"/>
  <text x="80" y="206" class="t t-w" style="font-weight:700">L3 - BorrowDeskMarket V2 (core logic)</text>
  <text x="80" y="228" class="t t-w" style="font-size:11px">Multi-collateral account, soft-session oracle, util APR, supply shares, atomic deposit+borrow, liquidation</text>

  <rect x="60" y="260" width="800" height="52" rx="4" class="l3"/>
  <text x="80" y="282" class="t" style="font-weight:700">L2 - Asset and oracle rails</text>
  <text x="80" y="300" class="t t-s">RH Stock Tokens, USDG (Paxos), Chainlink AggregatorV3, corporate-action multiplier in feed price</text>

  <rect x="60" y="322" width="800" height="52" rx="4" class="l2"/>
  <text x="80" y="344" class="t t-w" style="font-weight:700">L1 - Settlement</text>
  <text x="80" y="362" class="t t-w" style="font-size:11px">Robinhood Chain, chainId 4663, EVM, Blockscout, Sourcify verification</text>
</svg>
